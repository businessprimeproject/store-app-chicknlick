services:
  - type: web
    name: chick-n-lick-portal
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        value: https://chick-n-lick-portal.onrender.com
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: true
      - key: LOG_CHANNEL
        value: stderr
